<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>马年手势互动祝福</title>

<script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

<script type="importmap-shim">
{
  "imports": {
    "three": "https://unpkg.com/three@0.182.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.182.0/examples/jsm/"
  }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>

<style>
html,body{margin:0;height:100%;background:#050506;overflow:hidden}
canvas{display:block}
#focusOverlay{
  position:fixed;inset:0;display:flex;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;
  transition:.3s;
}
#focusOverlay.show{opacity:1;pointer-events:auto}
.focusCard{
  width:360px;background:#b11226;
  border-radius:18px;padding:18px;
  color:#fff;text-align:center
}
.focusCard img{width:160px;border-radius:12px}
</style>
</head>

<body>
<canvas id="gl"></canvas>

<div id="focusOverlay">
  <div class="focusCard">
    <img id="focusAvatar"/>
    <h3 id="focusName"></h3>
    <p id="focusMsg"></p>
  </div>
</div>

<video id="cam" playsinline style="display:none"></video>

<script type="module-shim">
import * as THREE from "three";

const canvas=document.getElementById("gl");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(2,devicePixelRatio));

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);
camera.position.z=12;

scene.add(new THREE.AmbientLight(0xffffff,.6));

/* ---------- 文本粒子 ---------- */
function textPoints(text){
  const c=document.createElement("canvas");
  c.width=1200;c.height=300;
  const ctx=c.getContext("2d");
  ctx.fillStyle="#fff";
  ctx.font="900 160px sans-serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(text,600,150);
  const img=ctx.getImageData(0,0,1200,300).data;
  const pts=[];
  for(let y=0;y<300;y+=4)
   for(let x=0;x<1200;x+=4){
     if(img[(y*1200+x)*4+3]>20)
      pts.push((x-600)/80,(150-y)/80,0);
   }
  return pts;
}

const geo=new THREE.BufferGeometry();
const pts=textPoints("Happy New Year");
geo.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));

const mat=new THREE.PointsMaterial({
  color:0xffd86a,size:.08,transparent:true
});
const textMesh=new THREE.Points(geo,mat);
scene.add(textMesh);

/* ---------- 马视频 ---------- */
const horseV=document.createElement("video");
horseV.src="video/horse.webm";
horseV.loop=true;horseV.muted=true;
const horseTex=new THREE.VideoTexture(horseV);
const horse=new THREE.Mesh(
  new THREE.PlaneGeometry(8,4.5),
  new THREE.MeshBasicMaterial({map:horseTex,transparent:true})
);
horse.position.z=-2;horse.visible=false;
scene.add(horse);

/* ---------- 同事数据 ---------- */
let colleagues=[];
fetch("./colleague.json").then(r=>r.json()).then(d=>colleagues=d);

/* ---------- 手势识别 ---------- */
const video=document.getElementById("cam");
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

const hands=new Hands({locateFile:f=>
`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});
hands.setOptions({maxNumHands:1});
hands.onResults(onHand);

let mode="TEXT";

function onHand(res){
 if(!res.multiHandLandmarks)return;
 const lm=res.multiHandLandmarks[0];
 const d=(a,b)=>Math.hypot(lm[a].x-lm[b].x,lm[a].y-lm[b].y);
 const pinch=d(4,8)<.04;
 const open=d(8,5)>.12 && d(12,9)>.12;

 if(pinch){
   pickColleague();
 }
 else if(open){
   mode="SCATTER";
 }
 else{
   mode="MERGE";
 }
}

hands.initialize();
const camLoop=async()=>{
 await hands.send({image:video});
 requestAnimationFrame(camLoop);
};
video.onloadeddata=camLoop;

/* ---------- 抽红包 ---------- */
const overlay=document.getElementById("focusOverlay");
function pickColleague(){
 if(!colleagues.length)return;
 const c=colleagues[Math.floor(Math.random()*colleagues.length)];
 document.getElementById("focusAvatar").src=
  "assets/images/"+c.avatar.split("/").pop();
 document.getElementById("focusName").innerText=c.name;
 document.getElementById("focusMsg").innerText=c.message;
 overlay.classList.add("show");
}

/* ---------- 动画 ---------- */
function animate(t){
 requestAnimationFrame(animate);
 textMesh.rotation.y+=0.002;
 textMesh.position.y=Math.sin(t*0.001)*.2;

 if(mode==="SCATTER"){
   horse.visible=true;
   horseV.play();
   textMesh.visible=false;
 }else{
   horse.visible=false;
   textMesh.visible=true;
 }
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
